name: Gerar APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/netpoint.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/netpoint.jks" >> "$GITHUB_ENV"
          fi

      - name: Firebase (google-services.json)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then printf '%s' "$GS_JSON" > android/app/google-services.json; echo "Firebase ligado"; else echo "Sem Firebase (app usa o aviso a cada 45 s)"; fi

      - name: Compilar
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk NetPoint-Rotas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NetPoint-Rotas-apk
          path: NetPoint-Rotas.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: NetPoint Rotas 1.0.${{ github.run_number }}
          body: |
            App Android do NetPoint Rotas Motoboy.
            Baixe o arquivo **NetPoint-Rotas.apk** abaixo pelo celular e instale.
            Link fixo da versão mais nova: https://github.com/${{ github.repository }}/releases/latest/download/NetPoint-Rotas.apk
          files: NetPoint-Rotas.apk
          make_latest: true
