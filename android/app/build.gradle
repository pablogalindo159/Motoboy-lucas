plugins {
    id 'com.android.application'
}

def numero = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
def temChave = System.getenv('KEYSTORE_PATH') != null

android {
    namespace 'br.com.netpoint.rotas'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.netpoint.rotas'
        minSdk 24
        targetSdk 34
        versionCode numero
        versionName "1.0.$numero"
    }

    signingConfigs {
        if (temChave) {
            netpoint {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig temChave ? signingConfigs.netpoint : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
